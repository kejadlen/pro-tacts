# The per-PR preview app (fly-pr-review-apps overrides the name with the
# PR's). It runs demo.ru rather than the image's own config.ru, which is
# the whole of what makes it a demo: the fixture book seeded on first
# boot, and a stand-in login, the same two the dev server gets. No
# volume, so every deploy starts from the fixtures again, and the one
# demo book is served to anyone who opens the URL.
app = 'pro-tacts-preview'
primary_region = 'sjc'

[build]

[processes]
  app = 'rackup -o 0.0.0.0 demo.ru'

[http_service]
  internal_port = 9292
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  PRO_TACTS_INSTANCE_NAME = 'pro-tacts (preview)'
  PRO_TACTS_ACCENT = 'clay'
