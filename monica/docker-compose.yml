# Run Monica with apache backend

services:
  proxy:
    image: mitmproxy/mitmproxy
    ports:
      - 8080:8080
      - 8081:8081
    command: mitmweb --web-host 0.0.0.0 --mode reverse:http://app:80 --set keep_host_header=true --set web_password=secret
    depends_on:
      - app

  app:
    image: monica:apache
    depends_on:
      - db
    ports:
      - 8082:80
    environment:
      - APP_ENV=production
      - APP_URL=https://undefined-fantastic-object.beefalo-toad.ts.net
      - APP_TRUSTED_PROXIES=*
      - DB_HOST=db
      - DB_DATABASE=monica
      - DB_USERNAME=monica
      - DB_PASSWORD=secret
      - LOG_CHANNEL=stderr
      - CACHE_DRIVER=database
      - SESSION_DRIVER=database
      - QUEUE_DRIVER=sync
    volumes:
      - data:/var/www/html/storage
    restart: always

  db:
    image: mariadb:11
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=monica
      - MYSQL_USER=monica
      - MYSQL_PASSWORD=secret
    volumes:
      - mysqldata:/var/lib/mysql
    restart: always


volumes:
  data:
    driver: local
  mysqldata:
    driver: local
